name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: npx electron-builder --mac dmg --x64 --arm64 --universal --publish never
          - os: windows-latest
            command: npx electron-builder --win nsis --x64 --ia32 --arm64 --publish never
          - os: ubuntu-latest
            command: npx electron-builder --linux AppImage deb --x64 --arm64 --publish never
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Build desktop packages
        shell: bash
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop-release/*.dmg
            desktop-release/*.exe
            desktop-release/*.AppImage
            desktop-release/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop-assets
      - name: Create checksums
        working-directory: desktop-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" desktop-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
